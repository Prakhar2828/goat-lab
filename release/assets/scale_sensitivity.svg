<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080b12"/>
  <text x="120" y="90" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">The winner changes with the scaling method</text>
  <text x="120" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="26">LeBron − Jordan score margin; positive is LeBron, negative is Jordan</text>
  <line x1="800" y1="155" x2="800" y2="775" stroke="#64748b" stroke-width="3"/>
  <text x="120" y="196" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">bounded_logit_tail</text><rect x="800.0" y="156" width="21.4" height="48" rx="12" fill="#f59e0b"/><text x="1340" y="196" text-anchor="end" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26">+0.115 — LeBron James</text>
  <text x="120" y="346" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">historical_percentile</text><rect x="320.0" y="306" width="480.0" height="48" rx="12" fill="#cbd5e1"/><text x="1340" y="346" text-anchor="end" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26">-2.583 — Michael Jordan</text>
  <text x="120" y="496" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">normal_score_tail</text><rect x="800.0" y="456" width="413.7" height="48" rx="12" fill="#f59e0b"/><text x="1340" y="496" text-anchor="end" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26">+2.226 — LeBron James</text>
  <text x="120" y="646" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">robust_mad_reference</text><rect x="746.8" y="606" width="53.2" height="48" rx="12" fill="#cbd5e1"/><text x="1340" y="646" text-anchor="end" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26">-0.286 — Michael Jordan</text>
  <text x="120" y="840" fill="#94a3b8" font-family="Arial, sans-serif" font-size="27">That is why GOAT Lab labels the v1 conclusion conditional rather than universal.</text>
</svg>
