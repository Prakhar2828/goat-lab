[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goat-lab"
version = "1.0.0"
description = "Coverage-aware Jordan vs. LeBron GOAT analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.20",
  "pyarrow>=18",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "plotly>=5.24",
  "streamlit>=1.41",
  "pyyaml>=6.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "requests>=2.32",
  "tenacity>=9.0",
  "nba_api>=1.6",
  "typer>=0.15",
  "rich>=13.9",
  "joblib>=1.4",
  "pandera>=0.22",
  "shap>=0.46",
  "gdeltdoc>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
]
bayes = ["pymc>=5.19", "arviz>=0.20"]

[project.scripts]
goatlab = "goatlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/goatlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/audit_model_integrity.py" = ["BLE001"]
"scripts/check_historical_playoff_api.py" = ["BLE001"]
"scripts/inspect_game_history.py" = ["BLE001"]
"src/goatlab/data/expert_source_verification.py" = ["BLE001", "S110"]
"src/goatlab/data/import_bref_playoffs.py" = ["BLE001"]
"src/goatlab/data/nba_client.py" = ["BLE001", "S110"]
"src/goatlab/models/category_hierarchy.py" = ["TRY004"]
"src/goatlab/models/evidence_uncertainty.py" = ["TRY004"]
"src/goatlab/models/final_model.py" = ["TRY004"]
"src/goatlab/models/release_gate.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
